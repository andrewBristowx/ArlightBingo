name: Compilar ArlightBingo 1.48.39

on:
  workflow_dispatch:
  push:
    branches:
      - build/1.48.39-independent-mine-cleanup-accessibility
    paths:
      - '.github/workflows/build-1.48.39.yml'
      - '.github/import/14839-from-14838.patch.gz.b64.part*'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-1.48.39.yml'
      - '.github/import/14839-from-14838.patch.gz.b64.part*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: build/1.48.39-independent-mine-cleanup-accessibility

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Aplicar corrección 1.48.39
        shell: bash
        run: |
          set -euo pipefail
          cat .github/import/14839-from-14838.patch.gz.b64.part* | base64 -d | gzip -d > /tmp/14839.patch
          if ! grep -q '<version>1.48.39</version>' pom.xml; then
            patch -p1 < /tmp/14839.patch
          fi
          python scripts/validate_1_48_39.py
          git diff --check
          grep -q '<version>1.48.39</version>' pom.xml
          grep -q 'version: 1.48.39' src/main/resources/plugin.yml
          grep -q 'planFinalAccessibilitySpine' src/main/java/com/arlight/bingo/listeners/OverworldIslandLoreDecorator.java
          grep -q 'mine-cleanup' src/main/java/com/arlight/bingo/listeners/OverworldIslandLoreDecorator.java

      - name: Guardar fuente 1.48.39 en la rama
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pom.xml src/main/resources/plugin.yml BUILD_VERSION.txt SOURCE_VERSION.txt \
            CAMBIOS_1.48.39.txt PROBAR_1.48.39.txt scripts/validate_1_48_39.py \
            src/main/java/com/arlight/bingo/listeners/OverworldCampaignRecoveryCommands.java \
            src/main/java/com/arlight/bingo/listeners/OverworldIslandLoreDecorator.java
          if ! git diff --cached --quiet; then
            git commit -m 'ArlightBingo 1.48.39: separar limpieza de minas y corregir accesibilidad'
            git push origin HEAD:build/1.48.39-independent-mine-cleanup-accessibility
          fi

      - name: Instalar ArlightCore 1.20.0
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/andrewBristowx/ArlightCore.git /tmp/ArlightCore
          mvn -B -U -DskipTests -f /tmp/ArlightCore/pom.xml clean install

      - name: Compilar con Maven
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -U -DskipTests clean package

      - name: Verificar JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name 'original-*.jar' -print -quit)"
          test -n "$JAR"
          unzip -p "$JAR" plugin.yml | grep -q 'version: 1.48.39'
          jar tf "$JAR" | grep -q 'com/arlight/bingo/listeners/OverworldIslandLoreDecorator.class'

      - name: Reunir entregables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/source
          find target -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name 'original-*.jar' \
            -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -name '*.jar' -print -quit)"
          rsync -a --exclude '.git/' --exclude '.github/import/' --exclude 'target/' --exclude 'dist/' ./ dist/source/
          (cd dist/source && zip -qr ../ArlightBingo-1.48.39-SOURCE.zip .)
          sha256sum dist/*.jar > dist/ArlightBingo-1.48.39-SHA256.txt

      - name: Subir JAR compilado
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.39-JAR
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Subir fuente y verificación
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.39-SOURCE
          path: |
            dist/ArlightBingo-1.48.39-SOURCE.zip
            dist/ArlightBingo-1.48.39-SHA256.txt
          if-no-files-found: error
          retention-days: 30

name: Compilar ArlightBingo 1.48.41

on:
  workflow_dispatch:
  push:
    branches:
      - build/1.48.41-deterministic-recovery-organic-mine
    paths:
      - '.github/workflows/build-1.48.41.yml'
      - '.github/import/14841.patch.gz.b64.part*'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-1.48.41.yml'
      - '.github/import/14841.patch.gz.b64.part*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: build/1.48.41-deterministic-recovery-organic-mine

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Aplicar y validar corrección 1.48.41
        shell: bash
        run: |
          set -euo pipefail
          cat .github/import/14841.patch.gz.b64.part* | base64 -d | gzip -d > /tmp/14841.patch
          if ! grep -q '<version>1.48.41</version>' pom.xml; then
            git apply /tmp/14841.patch
          fi
          grep -q '<version>1.48.41</version>' pom.xml
          grep -q 'version: 1.48.41' src/main/resources/plugin.yml
          grep -q 'surfaceYAt' src/main/java/com/arlight/bingo/template/OverworldIslandGenerator.java
          grep -q 'all-damage' src/main/java/com/arlight/bingo/listeners/OverworldTerrainBlendCommands.java
          grep -q 'MinePathPoint' src/main/java/com/arlight/bingo/listeners/OverworldIslandLoreDecorator.java
          if grep -q 'planAccessibleServiceLoop(plan, mine);' src/main/java/com/arlight/bingo/listeners/OverworldIslandLoreDecorator.java; then
            echo 'La cuadrícula de corredores antigua sigue activa.' >&2
            exit 1
          fi
          git diff --check

      - name: Guardar fuente 1.48.41 en la rama
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pom.xml src/main/resources/plugin.yml BUILD_VERSION.txt SOURCE_VERSION.txt \
            src/main/java/com/arlight/bingo/listeners/OverworldCampaignRecoveryCommands.java \
            src/main/java/com/arlight/bingo/listeners/OverworldIslandLoreDecorator.java \
            src/main/java/com/arlight/bingo/listeners/OverworldTerrainBlendCommands.java \
            src/main/java/com/arlight/bingo/template/OverworldIslandGenerator.java
          if ! git diff --cached --quiet; then
            git commit -m 'ArlightBingo 1.48.41: recuperación determinista y mina orgánica'
            git push origin HEAD:build/1.48.41-deterministic-recovery-organic-mine
          fi

      - name: Instalar ArlightCore
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/andrewBristowx/ArlightCore.git /tmp/ArlightCore
          mvn -B -U -DskipTests -f /tmp/ArlightCore/pom.xml clean install

      - name: Compilar con Maven
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -U -DskipTests clean package

      - name: Verificar JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name 'original-*.jar' -print -quit)"
          test -n "$JAR"
          unzip -p "$JAR" plugin.yml | grep -q 'version: 1.48.41'
          jar tf "$JAR" | grep -q 'com/arlight/bingo/listeners/OverworldTerrainBlendCommands.class'
          jar tf "$JAR" | grep -q 'com/arlight/bingo/listeners/OverworldIslandLoreDecorator.class'
          jar tf "$JAR" | grep -q 'com/arlight/bingo/template/OverworldIslandGenerator.class'

      - name: Reunir entregables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/source
          find target -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name 'original-*.jar' -exec cp {} dist/ \;
          rsync -a --exclude '.git/' --exclude '.github/import/' --exclude 'target/' --exclude 'dist/' ./ dist/source/
          (cd dist/source && zip -qr ../ArlightBingo-1.48.41-SOURCE.zip .)
          sha256sum dist/*.jar > dist/ArlightBingo-1.48.41-SHA256.txt

      - name: Subir JAR compilado
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.41-JAR
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Subir fuente y verificación
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.41-SOURCE
          path: |
            dist/ArlightBingo-1.48.41-SOURCE.zip
            dist/ArlightBingo-1.48.41-SHA256.txt
          if-no-files-found: error
          retention-days: 30

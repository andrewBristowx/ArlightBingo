name: Aplicar fuente ArlightBingo 1.48.17

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-source:
    if: github.head_ref == 'candidate/bingo-1.48.17-targeted-route-repair' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar rama candidata
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Descargar y verificar cambios 1.48.17
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet gdown
          gdown 12GkIWiDIPX4gKbnOXCqWo-Sk8BA8pion -O /tmp/ArlightBingo-1.48.17-PAYLOAD.zip
          echo '405e7ab53ed5fb01ca6149728b23e71899a847daf1178f69f14a3d0ff3524ce7  /tmp/ArlightBingo-1.48.17-PAYLOAD.zip' | sha256sum -c -
          unzip -q -o /tmp/ArlightBingo-1.48.17-PAYLOAD.zip -d .
          python3 scripts/validate_1_48_17.py

      - name: Publicar fuente 1.48.17
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'La fuente 1.48.17 ya está aplicada.'
            exit 0
          fi
          git commit -m 'Aplicar reparación enfocada de rutas 1.48.17'
          git push origin HEAD:${{ github.head_ref }}

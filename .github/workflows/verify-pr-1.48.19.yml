name: Verificar ArlightBingo 1.48.19

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - ci/bingo-1.48.19-build-base

permissions:
  contents: read

jobs:
  build:
    if: github.head_ref == 'candidate/bingo-1.48.19-zoned-audit-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Descargar fuente 1.48.19
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet gdown
          gdown 1fam0gKETsBUKdkEhzgUSvqhByPUPkyuq -O source.zip
          echo '8df044e6ecaaeb74f5278056c8f823748415d18fe389251415430ce476ac6f40  source.zip' | sha256sum -c -
          unzip -q source.zip
          mv ArlightBingo-1.48.19-ZONED-AUDIT-RECOVERY-SOURCE source

      - name: Verificar fuente
        shell: bash
        run: |
          set -euo pipefail
          cd source
          grep -q '<version>1.48.19</version>' pom.xml
          grep -q '^version: 1.48.19$' src/main/resources/plugin.yml
          grep -q '1.48.19-zoned-audit-recovery-1' src/main/java/com/arlight/bingo/listeners/OverworldCampaignBuilder148.java
          grep -q 'restoreCitadelGreatHallInterior' src/main/java/com/arlight/bingo/listeners/OverworldCampaignArchitecture148.java
          grep -q 'reinforceBossWallFoundation' src/main/java/com/arlight/bingo/listeners/OverworldCampaignTerrain148.java
          grep -q 'int bypassX = cx + 25;' src/main/java/com/arlight/bingo/listeners/OverworldCampaignTerrain148.java
          grep -q 'zone-great-hall-furniture' src/main/java/com/arlight/bingo/listeners/OverworldAutoRepair148.java
          python3 scripts/validate_1_48_19.py

      - name: Descargar ArlightCore
        uses: actions/checkout@v4
        with:
          repository: andrewBristowx/ArlightCore
          ref: 597c130a5d5450ac92e02430def406ef22512bc9
          path: arlight-core

      - name: Instalar ArlightCore
        run: mvn -B -U -f arlight-core/pom.xml -DskipTests clean install

      - name: Compilar Bingo
        run: mvn -B -U -f source/pom.xml -DskipTests clean package

      - name: Verificar y empaquetar
        shell: bash
        run: |
          set -euo pipefail
          mkdir package
          cp source/target/ArlightBingo-1.48.19.jar package/
          unzip -p package/ArlightBingo-1.48.19.jar plugin.yml | grep -q '^version: 1.48.19$'
          unzip -l package/ArlightBingo-1.48.19.jar | grep -q 'OverworldAutoRepair148.class'
          unzip -l package/ArlightBingo-1.48.19.jar | grep -q 'OverworldCampaignArchitecture148.class'
          unzip -l package/ArlightBingo-1.48.19.jar | grep -q 'OverworldCampaignTerrain148.class'
          cp source.zip package/ArlightBingo-1.48.19-ZONED-AUDIT-RECOVERY-SOURCE.zip
          cd package
          sha256sum ArlightBingo-1.48.19.jar ArlightBingo-1.48.19-ZONED-AUDIT-RECOVERY-SOURCE.zip > ArlightBingo-1.48.19-SHA256.txt
          sha256sum -c ArlightBingo-1.48.19-SHA256.txt
          unzip -t ArlightBingo-1.48.19-ZONED-AUDIT-RECOVERY-SOURCE.zip

      - name: Subir entrega
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.19-DELIVERY
          path: package/*
          if-no-files-found: error
          retention-days: 90

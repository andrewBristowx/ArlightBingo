name: Compilar ArlightBingo 1.48.51

on:
  workflow_dispatch:
  push:
    branches:
      - feature/1.48.51-surface-guardian-cinematic-tests
    paths:
      - '.github/workflows/build-1.48.51.yml'
      - '.github/import/14851v2.part*'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-1.48.51.yml'
      - '.github/import/14851v2.part*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Descargar rama candidata
        uses: actions/checkout@v4
        with:
          ref: feature/1.48.51-surface-guardian-cinematic-tests
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Aplicar fuentes hasta 1.48.51
        shell: bash
        run: |
          set -euxo pipefail
          base64 -d .github/import/14845.patch.gz.b64 | gzip -d > /tmp/14845.patch
          git apply /tmp/14845.patch
          base64 -d .github/import/14846.patch.gz.b64 | gzip -d > /tmp/14846.patch
          git apply /tmp/14846.patch
          cat .github/import/14847.part00 .github/import/14847.part01 .github/import/14847.part02 .github/import/14847.part03 .github/import/14847.part04 .github/import/14847.part05 .github/import/14847.part06 > /tmp/14847.b64
          test "$(wc -c < /tmp/14847.b64)" -eq 10336
          base64 -d /tmp/14847.b64 | gzip -d > /tmp/14847.patch
          git apply /tmp/14847.patch
          base64 -d .github/import/14848.patch.gz.b64 | gzip -d > /tmp/14848.patch
          git apply /tmp/14848.patch
          sed -i '/display\.setShadowed(false);/d' src/main/java/com/arlight/bingo/util/CampaignItemBridge.java
          base64 -d .github/import/14849.patch.gz.b64 | gzip -d > /tmp/14849.patch
          git apply /tmp/14849.patch
          cat .github/import/14850.part00 .github/import/14850.part01 .github/import/14850.part02 .github/import/14850.part03 .github/import/14850.part04 > /tmp/14850.b64
          test "$(wc -c < /tmp/14850.b64)" -eq 5516
          base64 -d /tmp/14850.b64 | gzip -d > /tmp/14850.patch
          git apply /tmp/14850.patch
          cat .github/import/14851v2.part00 .github/import/14851v2.part01 .github/import/14851v2.part02 .github/import/14851v2.part03 .github/import/14851v2.part04 > /tmp/14851.b64
          test "$(wc -c < /tmp/14851.b64)" -eq 8036
          base64 -d /tmp/14851.b64 | gzip -d > /tmp/14851.patch
          git apply /tmp/14851.patch

          grep -q '<version>1.48.51</version>' pom.xml
          grep -q 'version: 1.48.51' src/main/resources/plugin.yml
          test -f src/main/java/com/arlight/bingo/util/SurfaceGuardianRequestBridge.java
          test -f src/main/java/com/arlight/bingo/commands/OverworldBossTestCommands.java
          grep -q 'arlightbosses:surface_guardian' src/main/java/com/arlight/bingo/listeners/OverworldVillageSafety.java
          grep -q 'boss-cinematic-request' src/main/java/com/arlight/bingo/listeners/OverworldCampaignLandscape148.java
          ! grep -q 'setShadowed' src/main/java/com/arlight/bingo/util/CampaignItemBridge.java
          git diff --check

      - name: Instalar ArlightCore
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/andrewBristowx/ArlightCore.git /tmp/ArlightCore
          mvn -B -U -DskipTests -f /tmp/ArlightCore/pom.xml clean install

      - name: Compilar con Maven
        run: mvn -B -U -DskipTests clean package

      - name: Verificar JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name 'original-*.jar' -print -quit)"
          test -n "$JAR"
          unzip -p "$JAR" plugin.yml | grep -q 'version: 1.48.51'
          jar tf "$JAR" > /tmp/jar-contents.txt
          grep -Fxq 'com/arlight/bingo/util/SurfaceGuardianRequestBridge.class' /tmp/jar-contents.txt
          grep -Fxq 'com/arlight/bingo/commands/OverworldBossTestCommands.class' /tmp/jar-contents.txt
          grep -Fxq 'com/arlight/bingo/listeners/OverworldCampaignLandscape148.class' /tmp/jar-contents.txt
          grep -Fxq 'com/arlight/bingo/listeners/OverworldVillageSafety.class' /tmp/jar-contents.txt

      - name: Reunir entregables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/source
          JAR="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name 'original-*.jar' -print -quit)"
          cp "$JAR" dist/ArlightBingo-1.48.51.jar
          rsync -a --exclude '.git/' --exclude '.github/import/' --exclude 'target/' --exclude 'dist/' ./ dist/source/
          (cd dist/source && zip -qr ../ArlightBingo-1.48.51-SOURCE.zip .)
          sha256sum dist/ArlightBingo-1.48.51.jar dist/ArlightBingo-1.48.51-SOURCE.zip > dist/ArlightBingo-1.48.51-SHA256.txt

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.51-JAR
          path: dist/ArlightBingo-1.48.51.jar
          if-no-files-found: error
          retention-days: 30

      - name: Subir fuente y hashes
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.51-SOURCE
          path: |
            dist/ArlightBingo-1.48.51-SOURCE.zip
            dist/ArlightBingo-1.48.51-SHA256.txt
          if-no-files-found: error
          retention-days: 30

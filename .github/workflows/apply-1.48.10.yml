name: Aplicar y compilar ArlightBingo 1.48.10

on:
  push:
    branches:
      - agent/bingo-1.48.10-road-safety-village-recovery
    paths:
      - '.github/arlight-1.48.10/ready.txt'

permissions:
  contents: write

jobs:
  apply-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Descargar candidata
        uses: actions/checkout@v4
        with:
          ref: agent/bingo-1.48.10-road-safety-village-recovery
          fetch-depth: 0

      - name: Reconstruir y aplicar parche verificado
        shell: bash
        run: |
          set -euo pipefail
          echo 'bc516784379815b9ae8bb89b51444bee33c928e0fe2dd089a81b71931bfb099a  .github/arlight-1.48.10/part00' | sha256sum -c -
          echo '485389d39b7b41f5915746d48cb8d787acd9d5b1af53686928dbce2fb2c30687  .github/arlight-1.48.10/part01' | sha256sum -c -
          echo '082169169e8a8bd7688acd2ce1ff23fe44c7f120d9f573f123211c7bdcfa1b6b  .github/arlight-1.48.10/part02' | sha256sum -c -
          echo 'f77b2620747478ca7fb3efc90eedfda282d79b556039283ad73779d254335ebe  .github/arlight-1.48.10/part03' | sha256sum -c -
          cat .github/arlight-1.48.10/part00 .github/arlight-1.48.10/part01 \
              .github/arlight-1.48.10/part02 .github/arlight-1.48.10/part03 \
              > /tmp/arlight-1.48.10.patch.gz.b64
          echo '8d02c375bbe5780b685756f7bf509d207f002bb7c653cf7bd98c2f8b63d7eece  /tmp/arlight-1.48.10.patch.gz.b64' | sha256sum -c -
          base64 --decode /tmp/arlight-1.48.10.patch.gz.b64 > /tmp/arlight-1.48.10.patch.gz
          echo '1f9fe74ea9d94e09c16d396d8338d7a2b4042bd3f4e67efc2b1dccaad947e1fe  /tmp/arlight-1.48.10.patch.gz' | sha256sum -c -
          gzip -dc /tmp/arlight-1.48.10.patch.gz > /tmp/arlight-1.48.10.patch
          echo '76d36abfa713208598542465fe9f1c0b96a013e6494d59f2bbedd9c3ce058ea9  /tmp/arlight-1.48.10.patch' | sha256sum -c -
          git apply --check /tmp/arlight-1.48.10.patch
          git apply /tmp/arlight-1.48.10.patch
          rm -rf .github/arlight-1.48.10
          python3 scripts/validate_1_48_10.py

      - name: Publicar fuente corregida
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Proteger aldeas y rehacer caminos en ArlightBingo 1.48.10'
          git push origin HEAD:agent/bingo-1.48.10-road-safety-village-recovery

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Descargar ArlightCore 1.20.0 canónico
        uses: actions/checkout@v4
        with:
          repository: andrewBristowx/ArlightCore
          ref: 597c130a5d5450ac92e02430def406ef22512bc9
          path: arlight-core

      - name: Instalar ArlightCore
        shell: bash
        run: mvn -B -U -f arlight-core/pom.xml -DskipTests clean install

      - name: Compilar y verificar
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -U clean package
          unzip -p target/ArlightBingo-1.48.10.jar plugin.yml | grep -q '^version: 1.48.10$'

      - name: Empaquetar entrega
        shell: bash
        run: |
          set -euo pipefail
          DELIVERY='ArlightBingo-1.48.10-ROAD-SAFETY-VILLAGE-RECOVERY'
          mkdir -p package/${DELIVERY}-SOURCE
          rsync -a --exclude '.git/' --exclude 'arlight-core/' --exclude 'target/' \
            --exclude 'package/' --exclude '.github/workflows/apply-1.48.10.yml' \
            ./ package/${DELIVERY}-SOURCE/
          cd package
          zip -qr ${DELIVERY}-SOURCE.zip ${DELIVERY}-SOURCE
          cp ../target/ArlightBingo-1.48.10.jar .
          sha256sum ArlightBingo-1.48.10.jar ${DELIVERY}-SOURCE.zip > ArlightBingo-1.48.10-SHA256.txt
          unzip -t ${DELIVERY}-SOURCE.zip
          sha256sum -c ArlightBingo-1.48.10-SHA256.txt
          rm -rf ${DELIVERY}-SOURCE

      - name: Subir entrega
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.10-DELIVERY
          path: |
            package/ArlightBingo-1.48.10.jar
            package/ArlightBingo-1.48.10-ROAD-SAFETY-VILLAGE-RECOVERY-SOURCE.zip
            package/ArlightBingo-1.48.10-SHA256.txt
          if-no-files-found: error
          retention-days: 90

name: Compilar ArlightBingo 1.48.23 fortaleza y coliseo

on:
  push:
    branches:
      - candidate/bingo-1.48.23-fortress-integration-coliseum-closure
  pull_request:
    branches:
      - candidate/bingo-1.48.22-strict-road-continuity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Descargar fuente exacta 1.48.23
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet gdown
          gdown 1ZpPWHM-Zen30cu-eAP_rm1Wq-Ly39ZXV -O source.zip
          echo '9e3cc17d3acee70eefb21e7d10704adc93b486edf634c0f10e870350d2c14bdb  source.zip' | sha256sum -c -
          unzip -q source.zip
          mv ArlightBingo-1.48.23-FORTRESS-INTEGRATION-COLISEUM-CLOSURE-SOURCE source

      - name: Verificar fuente
        shell: bash
        run: |
          set -euo pipefail
          cd source
          python3 scripts/validate_1_48_23.py
          grep -q '<version>1.48.23</version>' pom.xml
          grep -q '^version: 1.48.23$' src/main/resources/plugin.yml
          grep -q '^1.48.23$' BUILD_VERSION.txt
          grep -q '^1.48.23$' SOURCE_VERSION.txt
          grep -q '1.48.23-fortress-integration-coliseum-closure-1' src/main/java/com/arlight/bingo/listeners/OverworldCampaignBuilder148.java
          grep -q 'finalizeFortressAndColiseum' src/main/java/com/arlight/bingo/listeners/OverworldCampaignTerrain148.java
          grep -q 'restoreBossColiseumClosure' src/main/java/com/arlight/bingo/listeners/OverworldCampaignArchitecture148.java
          grep -q 'auditBossColiseumClosure' src/main/java/com/arlight/bingo/listeners/OverworldCampaignAudit148.java
          grep -q 'fortress-coliseum-final' src/main/java/com/arlight/bingo/listeners/OverworldAutoRepair148.java

      - name: Descargar ArlightCore canónico
        uses: actions/checkout@v4
        with:
          repository: andrewBristowx/ArlightCore
          ref: 597c130a5d5450ac92e02430def406ef22512bc9
          path: arlight-core

      - name: Instalar ArlightCore
        run: mvn -B -U -f arlight-core/pom.xml -DskipTests clean install

      - name: Compilar Bingo
        run: mvn -B -U -f source/pom.xml -DskipTests clean package

      - name: Verificar y empaquetar
        shell: bash
        run: |
          set -euo pipefail
          mkdir package
          cp source/target/ArlightBingo-1.48.23.jar package/
          unzip -p package/ArlightBingo-1.48.23.jar plugin.yml > compiled-plugin.yml
          grep -q '^version: 1.48.23$' compiled-plugin.yml
          jar tf package/ArlightBingo-1.48.23.jar > jar-contents.txt
          grep -Fxq 'com/arlight/bingo/listeners/OverworldAutoRepair148.class' jar-contents.txt
          grep -Fxq 'com/arlight/bingo/listeners/OverworldCampaignAudit148.class' jar-contents.txt
          grep -Fxq 'com/arlight/bingo/listeners/OverworldCampaignTerrain148.class' jar-contents.txt
          grep -Fxq 'com/arlight/bingo/listeners/OverworldCampaignArchitecture148.class' jar-contents.txt
          cp source.zip package/ArlightBingo-1.48.23-FORTRESS-INTEGRATION-COLISEUM-CLOSURE-SOURCE.zip
          cd package
          sha256sum ArlightBingo-1.48.23.jar ArlightBingo-1.48.23-FORTRESS-INTEGRATION-COLISEUM-CLOSURE-SOURCE.zip > ArlightBingo-1.48.23-SHA256.txt
          unzip -t ArlightBingo-1.48.23-FORTRESS-INTEGRATION-COLISEUM-CLOSURE-SOURCE.zip
          sha256sum -c ArlightBingo-1.48.23-SHA256.txt

      - name: Subir entrega
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.23-FORTRESS-INTEGRATION-COLISEUM-CLOSURE-DELIVERY
          path: package/*
          retention-days: 90

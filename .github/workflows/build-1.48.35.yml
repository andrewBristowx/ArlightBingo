name: Compilar ArlightBingo 1.48.35

on:
  workflow_dispatch:
  push:
    branches:
      - build/1.48.35-connected-mine-ecology
    paths:
      - '.github/workflows/build-1.48.35.yml'
      - '.github/import/14835.payload.b64.part*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: build/1.48.35-connected-mine-ecology

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Restaurar cambios ArlightBingo 1.48.35
        shell: bash
        run: |
          set -euo pipefail
          cat .github/import/14835.payload.b64.part* > /tmp/14835.payload.b64
          base64 -d /tmp/14835.payload.b64 > /tmp/14835.payload.tar.gz
          echo '1dc0a4fb59156d5e1fdc90a1ad976f8ef72081a7b6235541f0aed3f931efbd00  /tmp/14835.payload.tar.gz' | sha256sum -c -
          tar -xzf /tmp/14835.payload.tar.gz -C .
          grep -q '<version>1.48.35</version>' pom.xml
          grep -q 'version: 1.48.35' src/main/resources/plugin.yml
          grep -q '1.48.35-connected-mine-persistent-ecology-corruption-1' src/main/java/com/arlight/bingo/listeners/OverworldIslandLoreDecorator.java
          grep -q 'planPreservedGeodeAccess' src/main/java/com/arlight/bingo/listeners/OverworldIslandLoreDecorator.java
          grep -q 'LEAF_PERSISTENCE' src/main/java/com/arlight/bingo/listeners/OverworldIslandLoreDecorator.java
          grep -q 'CAMP_REPAIR' src/main/java/com/arlight/bingo/listeners/OverworldIslandLoreDecorator.java

      - name: Guardar fuente 1.48.35 en la rama
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            pom.xml \
            src/main/resources/plugin.yml \
            BUILD_VERSION.txt \
            CAMBIOS_1.48.35.txt \
            PROBAR_1.48.35.txt \
            src/main/java/com/arlight/bingo/listeners/OverworldIslandLoreDecorator.java
          if ! git diff --cached --quiet; then
            git commit -m 'Ampliar mina, vegetación y corrupción en ArlightBingo 1.48.35'
            git push origin HEAD:build/1.48.35-connected-mine-ecology
          fi

      - name: Instalar ArlightCore 1.20.0
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/andrewBristowx/ArlightCore.git /tmp/ArlightCore
          mvn -B -U -DskipTests -f /tmp/ArlightCore/pom.xml clean install

      - name: Compilar con Maven
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -U -DskipTests clean package

      - name: Reunir entregables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/source
          find target -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name 'original-*.jar' \
            -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -name '*.jar' -print -quit)"
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/import/' \
            --exclude 'target/' \
            --exclude 'dist/' \
            ./ dist/source/
          (cd dist/source && zip -qr ../ArlightBingo-1.48.35-SOURCE.zip .)
          sha256sum dist/*.jar > dist/ArlightBingo-1.48.35-SHA256.txt
          ls -lh dist

      - name: Subir JAR compilado
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.35-JAR
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Subir fuente y verificación
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.35-SOURCE
          path: |
            dist/ArlightBingo-1.48.35-SOURCE.zip
            dist/ArlightBingo-1.48.35-SHA256.txt
          if-no-files-found: error
          retention-days: 30

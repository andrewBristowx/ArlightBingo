name: Compilar ArlightBingo 1.48.24 porton y rutas

on:
  push:
    branches:
      - candidate/bingo-1.48.24-gate-route-reconciliation
  pull_request:
    branches:
      - candidate/bingo-1.48.23-fortress-integration-coliseum-closure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Descargar fuente exacta 1.48.24
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet gdown
          gdown 1ZpPWHM-Zen30cu-eAP_rm1Wq-Ly39ZXV -O source.zip
          echo '747fb2a9c4b21a7ada9c8efb4aca95daa885fd6f3ab8a177b5d8db3e61ac096d  source.zip' | sha256sum -c -
          unzip -q source.zip
          mv ArlightBingo-1.48.24-GATE-ROUTE-RECONCILIATION-SOURCE source

      - name: Verificar fuente
        shell: bash
        run: |
          set -euo pipefail
          cd source
          python3 scripts/validate_1_48_24.py
          grep -q '<version>1.48.24</version>' pom.xml
          grep -q '^version: 1.48.24$' src/main/resources/plugin.yml
          grep -q '^1.48.24$' BUILD_VERSION.txt
          grep -q '^1.48.24$' SOURCE_VERSION.txt
          grep -q '1.48.24-gate-route-reconciliation-1' src/main/java/com/arlight/bingo/listeners/OverworldCampaignBuilder148.java
          grep -q 'restoreClosedBossRitualGate' src/main/java/com/arlight/bingo/listeners/OverworldCampaignArchitecture148.java
          grep -q 'registerAuthoritativeRoadCell' src/main/java/com/arlight/bingo/listeners/OverworldCampaignAudit148.java
          grep -q 'boss-ritual-interior' src/main/java/com/arlight/bingo/listeners/OverworldCampaignStructures148.java
          grep -q 'route-reconciled-gate-final' src/main/java/com/arlight/bingo/listeners/OverworldAutoRepair148.java

      - name: Descargar ArlightCore canonico
        uses: actions/checkout@v4
        with:
          repository: andrewBristowx/ArlightCore
          ref: 597c130a5d5450ac92e02430def406ef22512bc9
          path: arlight-core

      - name: Instalar ArlightCore
        run: mvn -B -U -f arlight-core/pom.xml -DskipTests clean install

      - name: Compilar Bingo
        run: mvn -B -U -f source/pom.xml -DskipTests clean package

      - name: Verificar y empaquetar
        shell: bash
        run: |
          set -euo pipefail
          mkdir package
          cp source/target/ArlightBingo-1.48.24.jar package/
          unzip -p package/ArlightBingo-1.48.24.jar plugin.yml > compiled-plugin.yml
          grep -q '^version: 1.48.24$' compiled-plugin.yml
          jar tf package/ArlightBingo-1.48.24.jar > jar-contents.txt
          grep -Fxq 'com/arlight/bingo/listeners/OverworldCampaignLandscape148.class' jar-contents.txt
          grep -Fxq 'com/arlight/bingo/listeners/OverworldCampaignAudit148.class' jar-contents.txt
          grep -Fxq 'com/arlight/bingo/listeners/OverworldCampaignArchitecture148.class' jar-contents.txt
          grep -Fxq 'com/arlight/bingo/listeners/OverworldAutoRepair148.class' jar-contents.txt
          cp source.zip package/ArlightBingo-1.48.24-GATE-ROUTE-RECONCILIATION-SOURCE.zip
          cd package
          sha256sum ArlightBingo-1.48.24.jar ArlightBingo-1.48.24-GATE-ROUTE-RECONCILIATION-SOURCE.zip > ArlightBingo-1.48.24-SHA256.txt
          sha256sum -c ArlightBingo-1.48.24-SHA256.txt

      - name: Subir entrega
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.24-GATE-ROUTE-RECONCILIATION-DELIVERY
          path: package/*
          retention-days: 90

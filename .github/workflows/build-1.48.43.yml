name: Compilar ArlightBingo 1.48.43

on:
  workflow_dispatch:
  push:
    branches:
      - feature/1.48.43-template-ritual-gate-test
    paths:
      - '.github/workflows/build-1.48.43.yml'
      - '.github/import/14843.patch.gz.b64.part*'
      - 'src/**'
      - 'pom.xml'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Descargar rama candidata
        uses: actions/checkout@v4
        with:
          ref: feature/1.48.43-template-ritual-gate-test
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Aplicar y validar corrección 1.48.43
        shell: bash
        run: |
          set -euo pipefail
          cat .github/import/14843.patch.gz.b64.part* | base64 -d | gzip -d > /tmp/14843.patch
          if ! test -f src/main/java/com/arlight/bingo/listeners/OverworldRitualTestCommands.java; then
            git apply /tmp/14843.patch
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/com/arlight/bingo/listeners/OverworldCampaignLandscape148.java')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '            final int y = minY + layer;\n',
              '            final int layerIndex = layer;\n'
              '            final int y = minY + layerIndex;\n'
          )
          text = text.replace('0.75F + layer * 0.06F);', '0.75F + layerIndex * 0.06F);')
          text = text.replace('}, layer * 5L);', '}, layerIndex * 5L);')
          path.write_text(text, encoding='utf-8')
          PY

          grep -Fq '<version>1.48.43</version>' pom.xml
          grep -Fq 'version: 1.48.43' src/main/resources/plugin.yml
          grep -Fq 'class OverworldRitualTestCommands' src/main/java/com/arlight/bingo/listeners/OverworldRitualTestCommands.java
          grep -Fq 'TEST_GATE_MIN_X = 133' src/main/java/com/arlight/bingo/listeners/OverworldCampaignLandscape148.java
          grep -Fq 'TEST_GATE_MAX_X = 147' src/main/java/com/arlight/bingo/listeners/OverworldCampaignLandscape148.java
          grep -Fq 'TEST_GATE_MIN_Y = 90' src/main/java/com/arlight/bingo/listeners/OverworldCampaignLandscape148.java
          grep -Fq 'TEST_GATE_MAX_Y = 96' src/main/java/com/arlight/bingo/listeners/OverworldCampaignLandscape148.java
          grep -Fq 'TEST_GATE_Z = 192' src/main/java/com/arlight/bingo/listeners/OverworldCampaignLandscape148.java
          grep -Fq 'debugRitualTestReset' src/main/java/com/arlight/bingo/listeners/OverworldCampaignLandscape148.java
          grep -Fq 'final int layerIndex = layer;' src/main/java/com/arlight/bingo/listeners/OverworldCampaignLandscape148.java
          grep -Fq '0.75F + layerIndex * 0.06F);' src/main/java/com/arlight/bingo/listeners/OverworldCampaignLandscape148.java
          if grep -Fq '0.75F + layer * 0.06F);' src/main/java/com/arlight/bingo/listeners/OverworldCampaignLandscape148.java; then
            echo 'La captura mutable de layer sigue presente.' >&2
            exit 1
          fi
          grep -Fq 'void reset(World world)' src/main/java/com/arlight/bingo/listeners/OverworldMedalRitual.java
          git diff --check

      - name: Guardar fuente 1.48.43 en la rama
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pom.xml src/main/resources/plugin.yml BUILD_VERSION.txt SOURCE_VERSION.txt CAMBIOS_1.48.43.txt PROBAR_1.48.43.txt \
            src/main/java/com/arlight/bingo/commands/BingoCommand.java \
            src/main/java/com/arlight/bingo/listeners/OverworldRitualTestCommands.java \
            src/main/java/com/arlight/bingo/listeners/OverworldCampaignLandscape148.java \
            src/main/java/com/arlight/bingo/listeners/OverworldMedalRitual.java \
            src/main/java/com/arlight/bingo/listeners/OverworldVillageSafety.java
          if ! git diff --cached --quiet; then
            git commit -m 'ArlightBingo 1.48.43: corregir animación segura de la reja'
            git push origin HEAD:feature/1.48.43-template-ritual-gate-test
          fi

      - name: Instalar ArlightCore
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/andrewBristowx/ArlightCore.git /tmp/ArlightCore
          mvn -B -U -DskipTests -f /tmp/ArlightCore/pom.xml clean install

      - name: Compilar con Maven
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -U -DskipTests clean package

      - name: Verificar JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name 'original-*.jar' -print -quit)"
          test -n "$JAR"
          unzip -p "$JAR" plugin.yml | grep -Fq 'version: 1.48.43'
          jar tf "$JAR" | grep -Fq 'com/arlight/bingo/listeners/OverworldRitualTestCommands.class'
          jar tf "$JAR" | grep -Fq 'com/arlight/bingo/listeners/OverworldMedalRitual.class'
          jar tf "$JAR" | grep -Fq 'com/arlight/bingo/listeners/OverworldCampaignLandscape148.class'

      - name: Reunir entregables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/source
          JAR="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name 'original-*.jar' -print -quit)"
          cp "$JAR" dist/ArlightBingo-1.48.43.jar
          rsync -a --exclude '.git/' --exclude '.github/import/' --exclude 'target/' --exclude 'dist/' ./ dist/source/
          (cd dist/source && zip -qr ../ArlightBingo-1.48.43-SOURCE.zip .)
          sha256sum dist/ArlightBingo-1.48.43.jar dist/ArlightBingo-1.48.43-SOURCE.zip > dist/ArlightBingo-1.48.43-SHA256.txt

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.43-JAR
          path: dist/ArlightBingo-1.48.43.jar
          if-no-files-found: error
          retention-days: 30

      - name: Subir fuente y hashes
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.43-SOURCE
          path: |
            dist/ArlightBingo-1.48.43-SOURCE.zip
            dist/ArlightBingo-1.48.43-SHA256.txt
          if-no-files-found: error
          retention-days: 30

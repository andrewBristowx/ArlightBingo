name: Compilar ArlightBingo 1.48.32

on:
  workflow_dispatch:
  push:
    branches:
      - build/1.48.32-lore-mine-decoration
    paths:
      - '.github/workflows/build-1.48.32.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Registrar ejecución
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/run-info
          printf '%s\n' "$GITHUB_RUN_ID" > .github/run-info/LAST_RUN_ID_14832.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/run-info/LAST_RUN_ID_14832.txt
          if ! git diff --cached --quiet; then
            git commit -m "Registrar build 1.48.32 ${GITHUB_RUN_ID}"
            git push origin HEAD:build/1.48.32-lore-mine-decoration
          fi

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Instalar ArlightCore 1.20.0
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/andrewBristowx/ArlightCore.git /tmp/ArlightCore
          mvn -B -U -DskipTests -f /tmp/ArlightCore/pom.xml clean install

      - name: Restaurar fuente ArlightBingo 1.48.32
        shell: bash
        run: |
          set -euo pipefail
          cat .github/import/14832.patch.b64.part* > /tmp/14832.patch.b64
          base64 -d /tmp/14832.patch.b64 > /tmp/14832.patch.tar.gz
          echo '424a5bc559689ea7617ab5af6f7ee998e79db84f23a89ae4d0b85bc75f82981d  /tmp/14832.patch.tar.gz' | sha256sum -c -
          tar -xzf /tmp/14832.patch.tar.gz -C .
          sed -i 's/lectern\.setBook(book);/lectern.getInventory().setItem(0, book);/' \
            src/main/java/com/arlight/bingo/listeners/OverworldIslandLoreDecorator.java
          grep -q 'lectern.getInventory().setItem(0, book);' \
            src/main/java/com/arlight/bingo/listeners/OverworldIslandLoreDecorator.java
          grep -q '<version>1.48.32</version>' pom.xml
          grep -q 'version: 1.48.32' src/main/resources/plugin.yml
          test -f src/main/java/com/arlight/bingo/listeners/OverworldIslandLoreDecorator.java

      - name: Guardar fuente 1.48.32 en la rama
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            pom.xml \
            src/main/resources/plugin.yml \
            BUILD_VERSION.txt \
            CAMBIOS_1.48.32.txt \
            BUILD_NOTES_1.48.32.txt \
            src/main/java/com/arlight/bingo/listeners/OverworldIslandLoreDecorator.java \
            src/main/java/com/arlight/bingo/listeners/OverworldVillageSafety.java
          if ! git diff --cached --quiet; then
            git commit -m 'Corregir diarios de la mina y compilar ArlightBingo 1.48.32'
            git push origin HEAD:build/1.48.32-lore-mine-decoration
          fi

      - name: Compilar con Maven
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -U -DskipTests clean package

      - name: Reunir entregables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/source
          find target -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name 'original-*.jar' \
            -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -name '*.jar' -print -quit)"
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/import/' \
            --exclude '.github/run-info/' \
            --exclude 'target/' \
            --exclude 'dist/' \
            ./ dist/source/
          (cd dist/source && zip -qr ../ArlightBingo-1.48.32-SOURCE.zip .)
          sha256sum dist/*.jar > dist/ArlightBingo-1.48.32-SHA256.txt
          ls -lh dist

      - name: Subir JAR compilado
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.32-JAR
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Subir fuente y verificación
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.32-SOURCE
          path: |
            dist/ArlightBingo-1.48.32-SOURCE.zip
            dist/ArlightBingo-1.48.32-SHA256.txt
          if-no-files-found: error
          retention-days: 30

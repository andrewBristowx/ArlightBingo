name: Compilar ArlightBingo 1.48.32

on:
  workflow_dispatch:
  push:
    branches:
      - build/1.48.32-lore-mine-decoration
    paths:
      - '.github/workflows/build-1.48.32.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Instalar ArlightCore 1.20.0
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/andrewBristowx/ArlightCore.git /tmp/ArlightCore
          mvn -B -U -DskipTests -f /tmp/ArlightCore/pom.xml clean install

      - name: Descargar fuente ArlightBingo 1.48.32
        shell: bash
        run: |
          set -euo pipefail
          FILE_ID='1b_5x64s4GW08JrceTBAi0dROcSmhlvFn'
          curl -L --fail --retry 3 \
            "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t" \
            -o /tmp/ArlightBingo-1.48.32-source.zip
          unzip -t /tmp/ArlightBingo-1.48.32-source.zip
          rm -rf /tmp/ArlightBingo-1.48.32-source
          mkdir -p /tmp/ArlightBingo-1.48.32-source
          unzip -q /tmp/ArlightBingo-1.48.32-source.zip -d /tmp/ArlightBingo-1.48.32-source

      - name: Localizar proyecto Maven
        id: source
        shell: bash
        run: |
          set -euo pipefail
          POM="$(find /tmp/ArlightBingo-1.48.32-source -maxdepth 5 -type f -name pom.xml | head -n 1)"
          if [ -z "$POM" ]; then
            echo 'No se encontró pom.xml dentro del ZIP.' >&2
            exit 1
          fi
          ROOT="$(dirname "$POM")"
          grep -q '<version>1.48.32</version>' "$POM"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Proyecto: $ROOT"

      - name: Importar fuente completa a la rama
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.source.outputs.root }}"
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            "$ROOT/" ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Importar fuente ArlightBingo 1.48.32 lore mine decoration'
            git push origin HEAD:build/1.48.32-lore-mine-decoration
          fi

      - name: Compilar con Maven
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -U -DskipTests clean package

      - name: Reunir entregables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/source
          find target -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name 'original-*.jar' \
            -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -name '*.jar' -print -quit)"
          rsync -a --exclude '.git/' --exclude 'target/' --exclude 'dist/' ./ dist/source/
          (cd dist/source && zip -qr ../ArlightBingo-1.48.32-SOURCE.zip .)
          sha256sum dist/*.jar > dist/ArlightBingo-1.48.32-SHA256.txt
          ls -lh dist

      - name: Subir JAR compilado
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.32-JAR
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Subir fuente y verificación
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.32-SOURCE
          path: |
            dist/ArlightBingo-1.48.32-SOURCE.zip
            dist/ArlightBingo-1.48.32-SHA256.txt
          if-no-files-found: error
          retention-days: 30

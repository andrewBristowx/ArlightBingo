name: Compilar ArlightBingo 1.48.21 paths fix

on:
  push:
    branches:
      - candidate/bingo-1.48.21-paths-fix
  pull_request:
    branches:
      - candidate/bingo-1.48.20-paths-leaves-fortress-integrity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Descargar fuente 1.48.21
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet gdown
          gdown 1ZpPWHM-Zen30cu-eAP_rm1Wq-Ly39ZXV -O source.zip
          echo '8827caedd53707a80cd4cc34817b09b3c48555273fc011db735205ae5445c146  source.zip' | sha256sum -c -
          unzip -q source.zip
          mv ArlightBingo-1.48.21-PATHS-FIX-SOURCE source

      - name: Verificar fuente
        shell: bash
        run: |
          set -euo pipefail
          cd source
          python3 scripts/validate_1_48_21.py
          grep -q '<version>1.48.21</version>' pom.xml
          grep -q '^version: 1.48.21$' src/main/resources/plugin.yml
          grep -q 'int cell = 4;' src/main/java/com/arlight/bingo/listeners/OverworldCampaignTerrain148.java
          grep -q 'int bridgeSteps = 14;' src/main/java/com/arlight/bingo/listeners/OverworldCampaignTerrain148.java
          grep -q '1.48.21-paths-fix-1' src/main/java/com/arlight/bingo/listeners/OverworldCampaignBuilder148.java

      - name: Descargar ArlightCore
        uses: actions/checkout@v4
        with:
          repository: andrewBristowx/ArlightCore
          ref: 597c130a5d5450ac92e02430def406ef22512bc9
          path: arlight-core

      - name: Instalar ArlightCore
        run: mvn -B -U -f arlight-core/pom.xml -DskipTests clean install

      - name: Compilar Bingo
        run: mvn -B -U -f source/pom.xml -DskipTests clean package

      - name: Verificar y empaquetar
        shell: bash
        run: |
          set -euo pipefail
          mkdir package
          cp source/target/ArlightBingo-1.48.21.jar package/
          unzip -p package/ArlightBingo-1.48.21.jar plugin.yml | grep -q '^version: 1.48.21$'
          unzip -l package/ArlightBingo-1.48.21.jar | grep -q 'OverworldCampaignTerrain148.class'
          cp source.zip package/ArlightBingo-1.48.21-PATHS-FIX-SOURCE.zip
          cd package
          sha256sum ArlightBingo-1.48.21.jar ArlightBingo-1.48.21-PATHS-FIX-SOURCE.zip > ArlightBingo-1.48.21-SHA256.txt
          sha256sum -c ArlightBingo-1.48.21-SHA256.txt

      - name: Subir entrega
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.21-PATHS-FIX-DELIVERY
          path: package/*
          retention-days: 90

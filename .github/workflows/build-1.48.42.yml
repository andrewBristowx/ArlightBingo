name: Compilar ArlightBingo 1.48.42

on:
  workflow_dispatch:
  push:
    branches:
      - feature/1.48.42-overworld-medal-ritual
    paths:
      - '.github/workflows/build-1.48.42.yml'
      - '.github/import/14842.patch.gz.b64.part*'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-1.48.42.yml'
      - '.github/import/14842.patch.gz.b64.part*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Descargar rama candidata
        uses: actions/checkout@v4
        with:
          ref: feature/1.48.42-overworld-medal-ritual
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Aplicar y validar corrección 1.48.42
        shell: bash
        run: |
          set -euo pipefail
          cat .github/import/14842.patch.gz.b64.part* | base64 -d | gzip -d > /tmp/14842.patch
          if ! grep -q '<version>1.48.42</version>' pom.xml; then
            git apply /tmp/14842.patch
          fi
          grep -q '<version>1.48.42</version>' pom.xml
          grep -q 'version: 1.48.42' src/main/resources/plugin.yml
          grep -q 'class OverworldMedalRitual' src/main/java/com/arlight/bingo/listeners/OverworldMedalRitual.java
          grep -q 'MOSSBOUND_HOME_MEDAL' src/main/java/com/arlight/bingo/util/CampaignItemBridge.java
          grep -q 'givepedestals' src/main/java/com/arlight/bingo/commands/BingoCommand.java
          git diff --check

      - name: Guardar fuente 1.48.42 en la rama
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pom.xml src/main/resources/plugin.yml BUILD_VERSION.txt SOURCE_VERSION.txt CAMBIOS_1.48.42.txt \
            src/main/java/com/arlight/bingo/commands/BingoCommand.java \
            src/main/java/com/arlight/bingo/dungeon/OverworldCampaignProgression.java \
            src/main/java/com/arlight/bingo/listeners/OverworldCampaignLandscape148.java \
            src/main/java/com/arlight/bingo/listeners/OverworldMedalRitual.java \
            src/main/java/com/arlight/bingo/util/CampaignItemBridge.java \
            src/main/java/com/arlight/bingo/util/CampaignMissionItems.java
          if ! git diff --cached --quiet; then
            git commit -m 'ArlightBingo 1.48.42: ritual de tres medallas GeckoLib'
            git push origin HEAD:feature/1.48.42-overworld-medal-ritual
          fi

      - name: Instalar ArlightCore
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/andrewBristowx/ArlightCore.git /tmp/ArlightCore
          mvn -B -U -DskipTests -f /tmp/ArlightCore/pom.xml clean install

      - name: Compilar con Maven
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -U -DskipTests clean package

      - name: Verificar JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name 'original-*.jar' -print -quit)"
          test -n "$JAR"
          unzip -p "$JAR" plugin.yml | grep -q 'version: 1.48.42'
          jar tf "$JAR" | grep -q 'com/arlight/bingo/listeners/OverworldMedalRitual.class'
          jar tf "$JAR" | grep -q 'com/arlight/bingo/util/CampaignMissionItems.class'
          jar tf "$JAR" | grep -q 'com/arlight/bingo/util/CampaignItemBridge.class'

      - name: Reunir entregables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/source
          JAR="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name 'original-*.jar' -print -quit)"
          cp "$JAR" dist/ArlightBingo-1.48.42.jar
          rsync -a --exclude '.git/' --exclude '.github/import/' --exclude 'target/' --exclude 'dist/' ./ dist/source/
          (cd dist/source && zip -qr ../ArlightBingo-1.48.42-SOURCE.zip .)
          sha256sum dist/ArlightBingo-1.48.42.jar dist/ArlightBingo-1.48.42-SOURCE.zip > dist/ArlightBingo-1.48.42-SHA256.txt

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.42-JAR
          path: dist/ArlightBingo-1.48.42.jar
          if-no-files-found: error
          retention-days: 30

      - name: Subir fuente y hashes
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.42-SOURCE
          path: |
            dist/ArlightBingo-1.48.42-SOURCE.zip
            dist/ArlightBingo-1.48.42-SHA256.txt
          if-no-files-found: error
          retention-days: 30

name: Compilar ArlightBingo 1.48.8

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
      - 'import/**'
      - 'agent/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verificar fuente y restricciones 1.48.8
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<version>1.48.8</version>' pom.xml
          grep -q '^version: 1.48.8$' src/main/resources/plugin.yml
          grep -q '^1.48.8$' BUILD_VERSION.txt
          grep -q '^ArlightBingo 1.48.8 INTERIOR-LANDMARK-FURNISHING-AUDIT$' SOURCE_VERSION.txt
          grep -q 'campaign_1_48_anchor_only' src/main/java/com/arlight/bingo/template/OverworldTemplateManager.java
          grep -q '1.48.8-interior-landmark-furnishing-audit-1' src/main/java/com/arlight/bingo/listeners/OverworldCampaignBuilder148.java
          grep -q 'frontón abierto' src/main/java/com/arlight/bingo/listeners/OverworldCampaignAudit148.java
          grep -q 'Step 6' src/main/java/com/arlight/bingo/listeners/OverworldCampaignAudit148.java
          grep -q 'pared abierta' src/main/java/com/arlight/bingo/listeners/OverworldCampaignAudit148.java
          grep -q 'torre inaccesible por escalera' src/main/java/com/arlight/bingo/listeners/OverworldCampaignAudit148.java
          grep -q 'chimenea cortada o flotante' src/main/java/com/arlight/bingo/listeners/OverworldCampaignAudit148.java
          grep -q 'corte abrupto del terreno' src/main/java/com/arlight/bingo/listeners/OverworldCampaignAudit148.java
          grep -q 'panel de cristal desconectado' src/main/java/com/arlight/bingo/listeners/OverworldCampaignAudit148.java
          grep -q 'entrada de torre enterrada o sin descansillo' src/main/java/com/arlight/bingo/listeners/OverworldCampaignAudit148.java
          grep -q 'supportedPathCell' src/main/java/com/arlight/bingo/listeners/OverworldCampaignArchitecture148.java
          ! grep -q 'addRestorePhases' src/main/java/com/arlight/bingo/listeners/OverworldCampaignBuilder148.java
          ! grep -q 'polishCoastlines' src/main/java/com/arlight/bingo/listeners/OverworldCampaignBuilder148.java
          ! grep -q 'adaptiveShoreline' src/main/java/com/arlight/bingo/listeners/OverworldCampaignTerrain148.java
          ! grep -q 'reinforceFoundation' src/main/java/com/arlight/bingo/listeners/OverworldCampaignTerrain148.java
          grep -q 'boss-portal-north-rim' src/main/java/com/arlight/bingo/listeners/OverworldCampaignTerrain148.java
          grep -q 'boss-portal-east-rim' src/main/java/com/arlight/bingo/listeners/OverworldCampaignTerrain148.java
          grep -q 'remaining = steps - step' src/main/java/com/arlight/bingo/listeners/OverworldCampaignTerrain148.java
          grep -q 'repairRoadCorridors' src/main/java/com/arlight/bingo/listeners/OverworldCampaignBuilder148.java
          grep -q 'repairRegisteredEntrances' src/main/java/com/arlight/bingo/listeners/OverworldCampaignBuilder148.java
          grep -q 'repairRegisteredVerticalAccess' src/main/java/com/arlight/bingo/listeners/OverworldCampaignBuilder148.java
          grep -q 'WALL_FOUNDATION_DEPTH = 12' src/main/java/com/arlight/bingo/listeners/OverworldCampaignTerrain148.java
          grep -q 'BOSS_GATE_CLEAR_HALF_WIDTH' src/main/java/com/arlight/bingo/listeners/OverworldCampaignArchitecture148.java
          grep -q 'clusteredVillageSurface' src/main/java/com/arlight/bingo/listeners/OverworldCampaignTerrain148.java
          grep -q 'landscapeBossApproachShoulders' src/main/java/com/arlight/bingo/listeners/OverworldCampaignTerrain148.java
          grep -q 'maceta flotante' src/main/java/com/arlight/bingo/listeners/OverworldCampaignAudit148.java
          grep -q 'interior sin mobiliario suficiente' src/main/java/com/arlight/bingo/listeners/OverworldCampaignAudit148.java
          grep -q 'portalSanctuaryFurnishings' src/main/java/com/arlight/bingo/listeners/OverworldCampaignArchitecture148.java
          grep -q 'arenaFurnishings' src/main/java/com/arlight/bingo/listeners/OverworldCampaignArchitecture148.java
          grep -q 'decorateHouseInterior' src/main/java/com/arlight/bingo/listeners/OverworldCampaignArchitecture148.java
          grep -q 'FAILED_MARKER' src/main/java/com/arlight/bingo/listeners/OverworldCampaignLandscape148.java
          grep -q 'Files.deleteIfExists(folder.resolve(PROGRESS_MARKER))' src/main/java/com/arlight/bingo/listeners/OverworldCampaignLandscape148.java
          grep -q 'new OverworldCampaignLandscape148' src/main/java/com/arlight/bingo/listeners/OverworldVillageSafety.java
          ! grep -q 'farmDistrict' src/main/java/com/arlight/bingo/listeners/OverworldCampaignStructures148.java
          ! grep -Eq 'Material\.(FARMLAND|WHEAT|CARROTS|POTATOES|BEETROOTS|MELON_STEM|PUMPKIN_STEM)' src/main/java/com/arlight/bingo/listeners/OverworldCampaignStructures148.java
          ! grep -q 'ritualSeal(out' src/main/java/com/arlight/bingo/listeners/OverworldCampaignStructures148.java
          ! grep -q 'citadel.getBlockZ() + 88' src/main/java/com/arlight/bingo/dungeon/OverworldCampaignProgression.java
          road_line=$(grep -n 'buildRoadNetwork' src/main/java/com/arlight/bingo/listeners/OverworldCampaignBuilder148.java | head -1 | cut -d: -f1)
          village_line=$(grep -n 'OverworldCampaignStructures148.village' src/main/java/com/arlight/bingo/listeners/OverworldCampaignBuilder148.java | head -1 | cut -d: -f1)
          test "${road_line}" -lt "${village_line}"
          python3 scripts/validate_1_48_8.py

      - name: Descargar ArlightCore 1.20.0 canónico
        uses: actions/checkout@v4
        with:
          repository: andrewBristowx/ArlightCore
          ref: 597c130a5d5450ac92e02430def406ef22512bc9
          path: arlight-core

      - name: Instalar ArlightCore
        shell: bash
        run: mvn -B -U -f arlight-core/pom.xml -DskipTests clean install

      - name: Compilar
        shell: bash
        run: mvn -B -U clean package

      - name: Verificar JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/ArlightBingo-1.48.8.jar dist/
          unzip -p dist/ArlightBingo-1.48.8.jar plugin.yml | grep -q '^version: 1.48.8$'
          unzip -l dist/ArlightBingo-1.48.8.jar | grep -q 'OverworldCampaignBuilder148.class'
          unzip -l dist/ArlightBingo-1.48.8.jar | grep -q 'OverworldCampaignTerrain148.class'
          unzip -l dist/ArlightBingo-1.48.8.jar | grep -q 'OverworldCampaignArchitecture148.class'
          unzip -l dist/ArlightBingo-1.48.8.jar | grep -q 'OverworldCampaignStructures148.class'
          unzip -l dist/ArlightBingo-1.48.8.jar | grep -q 'OverworldCampaignLandscape148.class'
          unzip -l dist/ArlightBingo-1.48.8.jar | grep -q 'OverworldCampaignAudit148.class'

      - name: Empaquetar entrega
        shell: bash
        run: |
          set -euo pipefail
          DELIVERY='ArlightBingo-1.48.8-INTERIOR-LANDMARK-FURNISHING-AUDIT'
          mkdir -p package/${DELIVERY}-SOURCE
          rsync -a --exclude '.git/' --exclude 'arlight-core/' --exclude 'target/' --exclude 'dist/' --exclude 'package/' ./ package/${DELIVERY}-SOURCE/
          cd package
          zip -qr ${DELIVERY}-SOURCE.zip ${DELIVERY}-SOURCE
          cp ../dist/ArlightBingo-1.48.8.jar .
          sha256sum ArlightBingo-1.48.8.jar ${DELIVERY}-SOURCE.zip > ArlightBingo-1.48.8-SHA256.txt
          unzip -t ${DELIVERY}-SOURCE.zip
          sha256sum -c ArlightBingo-1.48.8-SHA256.txt
          rm -rf ${DELIVERY}-SOURCE

      - name: Subir entrega completa
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.8-DELIVERY
          path: |
            package/ArlightBingo-1.48.8.jar
            package/ArlightBingo-1.48.8-INTERIOR-LANDMARK-FURNISHING-AUDIT-SOURCE.zip
            package/ArlightBingo-1.48.8-SHA256.txt
          if-no-files-found: error
          retention-days: 90

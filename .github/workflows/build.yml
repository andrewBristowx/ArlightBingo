name: Compilar ArlightBingo 1.48.31

on:
  workflow_dispatch:
  push:
    branches:
      - build/1.48.31-island-decorator
    paths:
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Instalar ArlightCore 1.20.0
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/andrewBristowx/ArlightCore.git /tmp/ArlightCore
          mvn -B -U -DskipTests -f /tmp/ArlightCore/pom.xml clean install

      - name: Descargar fuente ArlightBingo 1.48.31
        shell: bash
        run: |
          set -euo pipefail
          FILE_ID='17gIqAAUlJHuSEw8NM5lizKCwKZXlWiJm'
          curl -L --fail --retry 3 \
            "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t" \
            -o /tmp/ArlightBingo-1.48.31-source.zip
          unzip -t /tmp/ArlightBingo-1.48.31-source.zip
          rm -rf /tmp/ArlightBingo-1.48.31-source
          mkdir -p /tmp/ArlightBingo-1.48.31-source
          unzip -q /tmp/ArlightBingo-1.48.31-source.zip -d /tmp/ArlightBingo-1.48.31-source

      - name: Localizar proyecto Maven
        id: source
        shell: bash
        run: |
          set -euo pipefail
          POM="$(find /tmp/ArlightBingo-1.48.31-source -maxdepth 5 -type f -name pom.xml | head -n 1)"
          if [ -z "$POM" ]; then
            echo 'No se encontró pom.xml dentro del ZIP.' >&2
            exit 1
          fi
          ROOT="$(dirname "$POM")"
          grep -q '<version>1.48.31</version>' "$POM"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Proyecto: $ROOT"

      - name: Compilar con Maven
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -U -DskipTests -f "${{ steps.source.outputs.root }}/pom.xml" clean package

      - name: Reunir JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find "${{ steps.source.outputs.root }}/target" -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name 'original-*.jar' \
            -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -name '*.jar' -print -quit)"
          ls -lh dist

      - name: Subir JAR compilado
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.31-JAR
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30

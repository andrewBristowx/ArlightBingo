name: Compilar ArlightBingo 1.48.17

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
      - 'import/**'
      - 'agent/**'
      - 'candidate/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verificar fuente 1.48.17
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<version>1.48.17</version>' pom.xml
          grep -q '^version: 1.48.17$' src/main/resources/plugin.yml
          grep -q '^1.48.17$' BUILD_VERSION.txt
          grep -q '^1.48.17$' SOURCE_VERSION.txt
          grep -q 'passed_1_48_17_targeted_route_repair' src/main/java/com/arlight/bingo/listeners/OverworldCampaignBuilder148.java
          grep -q 'class OverworldAutoRepair148' src/main/java/com/arlight/bingo/listeners/OverworldAutoRepair148.java
          grep -q 'repairScan' src/main/java/com/arlight/bingo/template/OverworldTemplateManager.java
          grep -q 'repairPreview' src/main/java/com/arlight/bingo/template/OverworldTemplateManager.java
          grep -q 'repairRollback' src/main/java/com/arlight/bingo/template/OverworldTemplateManager.java
          grep -q 'template-worlds.overworld.autorepair.enabled' src/main/java/com/arlight/bingo/BingoPlugin.java
          python3 scripts/validate_1_48_17.py

      - name: Descargar ArlightCore 1.20.0 canónico
        uses: actions/checkout@v4
        with:
          repository: andrewBristowx/ArlightCore
          ref: 597c130a5d5450ac92e02430def406ef22512bc9
          path: arlight-core

      - name: Instalar ArlightCore
        shell: bash
        run: mvn -B -U -f arlight-core/pom.xml -DskipTests clean install

      - name: Compilar
        shell: bash
        run: mvn -B -U clean package

      - name: Verificar JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/ArlightBingo-1.48.17.jar dist/
          unzip -p dist/ArlightBingo-1.48.17.jar plugin.yml | grep -q '^version: 1.48.17$'
          unzip -l dist/ArlightBingo-1.48.17.jar | grep -q 'OverworldAutoRepair148.class'
          unzip -l dist/ArlightBingo-1.48.17.jar | grep -q 'OverworldCampaignBuilder148.class'
          unzip -l dist/ArlightBingo-1.48.17.jar | grep -q 'OverworldCampaignAudit148.class'
          unzip -l dist/ArlightBingo-1.48.17.jar | grep -q 'OverworldTemplateManager.class'
          unzip -l dist/ArlightBingo-1.48.17.jar | grep -q 'BingoCommand.class'

      - name: Empaquetar entrega
        shell: bash
        run: |
          set -euo pipefail
          DELIVERY='ArlightBingo-1.48.17-TARGETED-ROUTE-REPAIR'
          mkdir -p package/${DELIVERY}-SOURCE
          rsync -a --exclude '.git/' --exclude 'arlight-core/' --exclude 'target/' --exclude 'dist/' --exclude 'package/' ./ package/${DELIVERY}-SOURCE/
          cd package
          zip -qr ${DELIVERY}-SOURCE.zip ${DELIVERY}-SOURCE
          cp ../dist/ArlightBingo-1.48.17.jar .
          sha256sum ArlightBingo-1.48.17.jar ${DELIVERY}-SOURCE.zip > ArlightBingo-1.48.17-SHA256.txt
          unzip -t ${DELIVERY}-SOURCE.zip
          sha256sum -c ArlightBingo-1.48.17-SHA256.txt
          rm -rf ${DELIVERY}-SOURCE

      - name: Subir entrega completa
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.17-DELIVERY
          path: |
            package/ArlightBingo-1.48.17.jar
            package/ArlightBingo-1.48.17-TARGETED-ROUTE-REPAIR-SOURCE.zip
            package/ArlightBingo-1.48.17-SHA256.txt
          if-no-files-found: error
          retention-days: 90

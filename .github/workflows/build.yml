name: Compilar ArlightBingo 1.43.0

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
      - 'import/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verificar fuente 1.43.0
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<version>1.43.0</version>' pom.xml
          grep -q '^version: 1.43.0$' src/main/resources/plugin.yml
          grep -q '^1.43.0$' BUILD_VERSION.txt
          grep -q '^ArlightBingo 1.43.0 LIVING-OCCUPIED-VILLAGES$' SOURCE_VERSION.txt
          grep -q '1.43.0-living-occupied-villages' src/main/java/com/arlight/bingo/template/OverworldTemplateManager.java
          grep -q 'buildInvadedCapitalV3' src/main/java/com/arlight/bingo/template/OverworldTemplateManager.java
          grep -q 'class OverworldVillageSafety' src/main/java/com/arlight/bingo/listeners/OverworldVillageSafety.java
          grep -q 'buildVillageBakery' src/main/java/com/arlight/bingo/template/OverworldTemplateManager.java

      - name: Descargar ArlightCore 1.20.0 canónico
        uses: actions/checkout@v4
        with:
          repository: andrewBristowx/ArlightCore
          ref: 597c130a5d5450ac92e02430def406ef22512bc9
          path: arlight-core

      - name: Instalar dependencia ArlightCore 1.20.0
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<version>1.20.0</version>' arlight-core/pom.xml
          mvn -B -U -f arlight-core/pom.xml -DskipTests clean install

      - name: Compilar con Maven
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -U clean package

      - name: Reunir JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find target -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' \
            -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -name '*.jar' -print -quit)"
          unzip -p dist/ArlightBingo-1.43.0.jar plugin.yml | grep -q '^version: 1.43.0$'
          unzip -l dist/ArlightBingo-1.43.0.jar | grep -q 'OverworldIslandGenerator.class'
          unzip -l dist/ArlightBingo-1.43.0.jar | grep -q 'OverworldVillageSafety.class'
          javap -classpath dist/ArlightBingo-1.43.0.jar -p \
            'com.arlight.bingo.template.OverworldTemplateManager$OverworldTemplateBuilder' \
            | grep -q 'buildInvadedCapitalV3'
          ls -lh dist

      - name: Subir JAR compilado
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.43.0-JAR
          path: dist/*.jar
          if-no-files-found: error

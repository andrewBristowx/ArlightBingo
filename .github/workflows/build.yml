name: Compilar ArlightBingo 1.40.0

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
      - 'import/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verificar fuente 1.40.0
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<version>1.40.0</version>' pom.xml
          grep -q '^version: 1.40.0$' src/main/resources/plugin.yml
          grep -q '^1.40.0$' BUILD_VERSION.txt

      - name: Instalar dependencia ArlightCore 1.20.0
        shell: bash
        run: |
          set -euo pipefail
          CORE_ID='1ZTvzmN3bwT5Xe56dLvfjcI4ISDN0lsPB'
          curl -L --fail --retry 3 \
            "https://drive.usercontent.google.com/download?id=${CORE_ID}&export=download&confirm=t" \
            -o /tmp/arlightcore.zip
          rm -rf /tmp/arlightcore
          mkdir -p /tmp/arlightcore
          unzip -q /tmp/arlightcore.zip -d /tmp/arlightcore
          CORE_POM="$(find /tmp/arlightcore -maxdepth 5 -type f -name pom.xml | head -n 1)"
          if [ -z "$CORE_POM" ]; then
            echo 'No se encontró pom.xml de ArlightCore.' >&2
            exit 1
          fi
          mvn -B -U -f "$CORE_POM" -DskipTests clean install

      - name: Compilar con Maven
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -U clean package

      - name: Reunir JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find target -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' \
            -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -name '*.jar' -print -quit)"
          ls -lh dist

      - name: Subir JAR compilado
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.40.0-JAR
          path: dist/*.jar
          if-no-files-found: error

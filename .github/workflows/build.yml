name: Compilar ArlightBingo 1.47.0

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
      - 'import/**'
      - 'agent/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verificar fuente 1.47.0
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<version>1.47.0</version>' pom.xml
          grep -q '^version: 1.47.0$' src/main/resources/plugin.yml
          grep -q '^1.47.0$' BUILD_VERSION.txt
          grep -q '^ArlightBingo 1.47.0 FORTRESS-INTEGRATION-POLISH$' SOURCE_VERSION.txt
          grep -q 'legacy-village-fragment' src/main/java/com/arlight/bingo/listeners/OverworldCampaignBuilder147.java
          grep -q 'farmDistrict' src/main/java/com/arlight/bingo/listeners/OverworldCampaignArchitecture147.java
          grep -q 'connectedPortcullis' src/main/java/com/arlight/bingo/listeners/OverworldCampaignArchitecture147.java
          grep -q 'integrateFortifications' src/main/java/com/arlight/bingo/listeners/OverworldCampaignTerrain147.java
          grep -q 'polishCoastlines' src/main/java/com/arlight/bingo/listeners/OverworldCampaignTerrain147.java
          grep -q 'new OverworldCampaignLandscape147' src/main/java/com/arlight/bingo/listeners/OverworldVillageSafety.java

      - name: Descargar ArlightCore 1.20.0 canónico
        uses: actions/checkout@v4
        with:
          repository: andrewBristowx/ArlightCore
          ref: 597c130a5d5450ac92e02430def406ef22512bc9
          path: arlight-core

      - name: Instalar ArlightCore
        shell: bash
        run: mvn -B -U -f arlight-core/pom.xml -DskipTests clean install

      - name: Compilar
        shell: bash
        run: mvn -B -U clean package

      - name: Verificar JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/ArlightBingo-1.47.0.jar dist/
          unzip -p dist/ArlightBingo-1.47.0.jar plugin.yml | grep -q '^version: 1.47.0$'
          unzip -l dist/ArlightBingo-1.47.0.jar | grep -q 'OverworldCampaignBuilder147.class'
          unzip -l dist/ArlightBingo-1.47.0.jar | grep -q 'OverworldCampaignTerrain147.class'
          unzip -l dist/ArlightBingo-1.47.0.jar | grep -q 'OverworldCampaignArchitecture147.class'
          unzip -l dist/ArlightBingo-1.47.0.jar | grep -q 'OverworldCampaignStructures147.class'
          unzip -l dist/ArlightBingo-1.47.0.jar | grep -q 'OverworldCampaignLandscape147.class'

      - name: Empaquetar entrega
        shell: bash
        run: |
          set -euo pipefail
          DELIVERY='ArlightBingo-1.47.0-FORTRESS-INTEGRATION-POLISH'
          mkdir -p package/${DELIVERY}-SOURCE
          rsync -a --exclude '.git/' --exclude 'arlight-core/' --exclude 'target/' --exclude 'dist/' --exclude 'package/' ./ package/${DELIVERY}-SOURCE/
          cd package
          zip -qr ${DELIVERY}-SOURCE.zip ${DELIVERY}-SOURCE
          cp ../dist/ArlightBingo-1.47.0.jar .
          sha256sum ArlightBingo-1.47.0.jar ${DELIVERY}-SOURCE.zip > ArlightBingo-1.47.0-SHA256.txt
          unzip -t ${DELIVERY}-SOURCE.zip
          sha256sum -c ArlightBingo-1.47.0-SHA256.txt
          rm -rf ${DELIVERY}-SOURCE

      - name: Subir entrega completa
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.47.0-DELIVERY
          path: |
            package/ArlightBingo-1.47.0.jar
            package/ArlightBingo-1.47.0-FORTRESS-INTEGRATION-POLISH-SOURCE.zip
            package/ArlightBingo-1.47.0-SHA256.txt
          if-no-files-found: error
          retention-days: 90

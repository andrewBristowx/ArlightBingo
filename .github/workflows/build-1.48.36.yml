name: Compilar ArlightBingo 1.48.36

on:
  workflow_dispatch:
  push:
    branches:
      - build/1.48.36-direct-template-dispatch
    paths:
      - '.github/workflows/build-1.48.36.yml'
      - '.github/import/14836-direct-dispatch.patch'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: build/1.48.36-direct-template-dispatch

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Aplicar corrección 1.48.36
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '<version>1.48.36</version>' pom.xml; then
            patch -p1 < .github/import/14836-direct-dispatch.patch
          fi
          grep -q '<version>1.48.36</version>' pom.xml
          grep -q 'version: 1.48.36' src/main/resources/plugin.yml
          grep -q 'dispatchOverworldTemplateUtility' src/main/java/com/arlight/bingo/BingoPlugin.java
          grep -q 'dispatchTemplateUtility' src/main/java/com/arlight/bingo/listeners/OverworldVillageSafety.java
          grep -q 'dispatchOverworldTemplateUtility(sender' src/main/java/com/arlight/bingo/commands/BingoCommand.java

      - name: Guardar fuente corregida en la rama
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pom.xml src/main/resources/plugin.yml BUILD_VERSION.txt \
            CAMBIOS_1.48.36.txt PROBAR_1.48.36.txt \
            src/main/java/com/arlight/bingo/BingoPlugin.java \
            src/main/java/com/arlight/bingo/commands/BingoCommand.java \
            src/main/java/com/arlight/bingo/listeners/OverworldVillageSafety.java \
            src/main/java/com/arlight/bingo/listeners/OverworldCampaignRecoveryCommands.java
          if ! git diff --cached --quiet; then
            git commit -m 'Corregir despacho directo de comandos seguros en ArlightBingo 1.48.36'
            git push origin HEAD:build/1.48.36-direct-template-dispatch
          fi

      - name: Instalar ArlightCore 1.20.0
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/andrewBristowx/ArlightCore.git /tmp/ArlightCore
          mvn -B -U -DskipTests -f /tmp/ArlightCore/pom.xml clean install

      - name: Compilar con Maven
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -U -DskipTests clean package

      - name: Reunir entregables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/source
          find target -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name 'original-*.jar' \
            -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -name '*.jar' -print -quit)"
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/import/' \
            --exclude 'target/' \
            --exclude 'dist/' \
            ./ dist/source/
          (cd dist/source && zip -qr ../ArlightBingo-1.48.36-SOURCE.zip .)
          sha256sum dist/*.jar > dist/ArlightBingo-1.48.36-SHA256.txt
          ls -lh dist

      - name: Subir JAR compilado
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.36-JAR
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Subir fuente y verificación
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.36-SOURCE
          path: |
            dist/ArlightBingo-1.48.36-SOURCE.zip
            dist/ArlightBingo-1.48.36-SHA256.txt
          if-no-files-found: error
          retention-days: 30

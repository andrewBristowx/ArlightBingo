name: Compilar ArlightBingo 1.48.28 terminación de fortaleza

on:
  push:
    branches:
      - candidate/bingo-1.48.28-fortress-finish-light-portal-clear
  pull_request:
    branches:
      - candidate/bingo-1.48.27-graded-gates-citadel-seal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Descargar fuente exacta 1.48.28
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet gdown
          gdown 1AOyv0u05mIejZ1lqxAOiTubQcnY0zBwG -O source.zip
          echo '38b7b1985e657842aae0ca7069b5e3be732072ea02a155d0f3a6009663e2f58a  source.zip' | sha256sum -c -
          unzip -q source.zip
          mv ArlightBingo-1.48.28-FORTRESS-FINISH-LIGHT-PORTAL-CLEAR-SOURCE source

      - name: Validar fuente
        shell: bash
        run: |
          set -euo pipefail
          cd source
          python3 scripts/validate_1_48_28.py
          grep -q '<version>1.48.28</version>' pom.xml
          grep -q '^version: 1.48.28$' src/main/resources/plugin.yml
          grep -q 'finishBossApproachCut' src/main/java/com/arlight/bingo/listeners/OverworldCampaignTerrain148.java
          grep -q 'applyMonotonicTerrainGrade' src/main/java/com/arlight/bingo/listeners/OverworldCampaignTerrain148.java
          grep -q 'restoreCriticalPassageLighting' src/main/java/com/arlight/bingo/listeners/OverworldCampaignArchitecture148.java
          grep -q 'zona reservada del portal contiene atriles' src/main/java/com/arlight/bingo/listeners/OverworldCampaignAudit148.java

      - name: Descargar ArlightCore
        uses: actions/checkout@v4
        with:
          repository: andrewBristowx/ArlightCore
          ref: 597c130a5d5450ac92e02430def406ef22512bc9
          path: arlight-core

      - name: Instalar ArlightCore
        run: mvn -B -U -f arlight-core/pom.xml -DskipTests clean install

      - name: Compilar Bingo
        run: mvn -B -U -f source/pom.xml -DskipTests clean package

      - name: Verificar y empaquetar
        shell: bash
        run: |
          set -euo pipefail
          mkdir package
          cp source/target/ArlightBingo-1.48.28.jar package/
          unzip -p package/ArlightBingo-1.48.28.jar plugin.yml | grep -q '^version: 1.48.28$'
          jar tf package/ArlightBingo-1.48.28.jar > jar-contents.txt
          grep -Fxq 'com/arlight/bingo/listeners/OverworldCampaignTerrain148.class' jar-contents.txt
          grep -Fxq 'com/arlight/bingo/listeners/OverworldCampaignArchitecture148.class' jar-contents.txt
          grep -Fxq 'com/arlight/bingo/listeners/OverworldCampaignAudit148.class' jar-contents.txt
          grep -Fxq 'com/arlight/bingo/listeners/OverworldAutoRepair148.class' jar-contents.txt
          cp source.zip package/ArlightBingo-1.48.28-FORTRESS-FINISH-LIGHT-PORTAL-CLEAR-SOURCE.zip
          cd package
          sha256sum ArlightBingo-1.48.28.jar ArlightBingo-1.48.28-FORTRESS-FINISH-LIGHT-PORTAL-CLEAR-SOURCE.zip > ArlightBingo-1.48.28-SHA256.txt
          sha256sum -c ArlightBingo-1.48.28-SHA256.txt

      - name: Subir entrega
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.28-FORTRESS-FINISH-LIGHT-PORTAL-CLEAR-DELIVERY
          path: package/*
          retention-days: 90

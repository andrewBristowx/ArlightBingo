name: Compilar ArlightBingo 1.48.27 conexiones graduadas

on:
  push:
    branches:
      - candidate/bingo-1.48.27-graded-gates-citadel-seal
  pull_request:
    branches:
      - candidate/bingo-1.48.26-one-pass-fortress-road-gate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Descargar fuente exacta 1.48.27
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet gdown
          gdown 1ZpPWHM-Zen30cu-eAP_rm1Wq-Ly39ZXV -O source.zip
          echo 'eda86c0fd333c9ccb106f6d681b54d4c38178e2f0a00b720f80ffeb2fe6fcdad  source.zip' | sha256sum -c -
          unzip -q source.zip
          mv ArlightBingo-1.48.27-GRADED-GATE-CONNECTIONS-CITADEL-SEAL-SOURCE source

      - name: Validar fuente
        shell: bash
        run: |
          set -euo pipefail
          cd source
          python3 scripts/validate_1_48_27.py
          grep -q '<version>1.48.27</version>' pom.xml
          grep -q '^version: 1.48.27$' src/main/resources/plugin.yml
          grep -q 'CITADEL_GATE_TRANSITION_LENGTH = 18' src/main/java/com/arlight/bingo/listeners/OverworldCampaignTerrain148.java
          grep -q 'shapeCitadelSite' src/main/java/com/arlight/bingo/listeners/OverworldCampaignTerrain148.java
          grep -q 'boss-approach-rim-connector' src/main/java/com/arlight/bingo/listeners/OverworldCampaignTerrain148.java
          grep -q 'auditCitadelSubsurface' src/main/java/com/arlight/bingo/listeners/OverworldCampaignAudit148.java

      - name: Descargar ArlightCore
        uses: actions/checkout@v4
        with:
          repository: andrewBristowx/ArlightCore
          ref: 597c130a5d5450ac92e02430def406ef22512bc9
          path: arlight-core

      - name: Instalar ArlightCore
        run: mvn -B -U -f arlight-core/pom.xml -DskipTests clean install

      - name: Compilar Bingo
        run: mvn -B -U -f source/pom.xml -DskipTests clean package

      - name: Verificar y empaquetar
        shell: bash
        run: |
          set -euo pipefail
          mkdir package
          cp source/target/ArlightBingo-1.48.27.jar package/
          unzip -p package/ArlightBingo-1.48.27.jar plugin.yml | grep -q '^version: 1.48.27$'
          jar tf package/ArlightBingo-1.48.27.jar > jar-contents.txt
          grep -Fxq 'com/arlight/bingo/listeners/OverworldCampaignTerrain148.class' jar-contents.txt
          grep -Fxq 'com/arlight/bingo/listeners/OverworldCampaignArchitecture148.class' jar-contents.txt
          grep -Fxq 'com/arlight/bingo/listeners/OverworldCampaignAudit148.class' jar-contents.txt
          grep -Fxq 'com/arlight/bingo/listeners/OverworldAutoRepair148.class' jar-contents.txt
          cp source.zip package/ArlightBingo-1.48.27-GRADED-GATE-CONNECTIONS-CITADEL-SEAL-SOURCE.zip
          cd package
          sha256sum ArlightBingo-1.48.27.jar ArlightBingo-1.48.27-GRADED-GATE-CONNECTIONS-CITADEL-SEAL-SOURCE.zip > ArlightBingo-1.48.27-SHA256.txt
          sha256sum -c ArlightBingo-1.48.27-SHA256.txt

      - name: Subir entrega
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.27-GRADED-GATE-CONNECTIONS-CITADEL-SEAL-DELIVERY
          path: package/*
          retention-days: 90

name: Compilar ArlightBingo 1.48.19

on:
  push:
    branches:
      - candidate/bingo-1.48.19-zoned-citadel-boss-foundation
  pull_request:
    branches:
      - candidate/bingo-1.48.18-fortress-zone-polish
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Descargar fuente 1.48.19
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet gdown
          gdown 1ZpPWHM-Zen30cu-eAP_rm1Wq-Ly39ZXV -O source.zip
          echo '2f0a92f06a8b0ef3b6ff6ea119f07e71e8317774a6b6b312a0278df1eafabfb8  source.zip' | sha256sum -c -
          unzip -q source.zip
          mv ArlightBingo-1.48.19-ZONED-CITADEL-BOSS-FOUNDATION-SOURCE source

      - name: Verificar fuente
        shell: bash
        run: |
          set -euo pipefail
          cd source
          python3 scripts/validate_1_48_19.py
          grep -q '<version>1.48.19</version>' pom.xml
          grep -q '^version: 1.48.19$' src/main/resources/plugin.yml
          grep -q 'int bypassX = site.x() + 29' src/main/java/com/arlight/bingo/listeners/OverworldCampaignStructures148.java
          grep -q 'reinforceBossNorthFoundation' src/main/java/com/arlight/bingo/listeners/OverworldCampaignTerrain148.java
          grep -q 'paveCitadelRouteSegment' src/main/java/com/arlight/bingo/listeners/OverworldCampaignTerrain148.java

      - name: Descargar ArlightCore
        uses: actions/checkout@v4
        with:
          repository: andrewBristowx/ArlightCore
          ref: 597c130a5d5450ac92e02430def406ef22512bc9
          path: arlight-core

      - name: Instalar ArlightCore
        run: mvn -B -U -f arlight-core/pom.xml -DskipTests clean install

      - name: Compilar Bingo
        run: mvn -B -U -f source/pom.xml -DskipTests clean package

      - name: Verificar y empaquetar
        shell: bash
        run: |
          set -euo pipefail
          mkdir package
          cp source/target/ArlightBingo-1.48.19.jar package/
          unzip -p package/ArlightBingo-1.48.19.jar plugin.yml | grep -q '^version: 1.48.19$'
          unzip -l package/ArlightBingo-1.48.19.jar | grep -q 'OverworldCampaignTerrain148.class'
          unzip -l package/ArlightBingo-1.48.19.jar | grep -q 'OverworldAutoRepair148.class'
          cp source.zip package/ArlightBingo-1.48.19-ZONED-CITADEL-BOSS-FOUNDATION-SOURCE.zip
          cd package
          sha256sum ArlightBingo-1.48.19.jar ArlightBingo-1.48.19-ZONED-CITADEL-BOSS-FOUNDATION-SOURCE.zip > ArlightBingo-1.48.19-SHA256.txt
          sha256sum -c ArlightBingo-1.48.19-SHA256.txt

      - name: Subir entrega
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.19-DELIVERY
          path: package/*
          retention-days: 90

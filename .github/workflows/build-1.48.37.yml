name: Compilar ArlightBingo 1.48.37

on:
  workflow_dispatch:
  push:
    branches:
      - build/1.48.37-single-accessible-mine-biomes
    paths:
      - '.github/workflows/build-1.48.37.yml'
      - '.github/import/14837-single-mine-biomes.patch.gz.b64'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-1.48.37.yml'
      - '.github/import/14837-single-mine-biomes.patch.gz.b64'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: build/1.48.37-single-accessible-mine-biomes

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Aplicar migración 1.48.37
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/import/14837-single-mine-biomes.patch.gz.b64 | gzip -d > /tmp/14837.patch
          if ! grep -q '<version>1.48.37</version>' pom.xml; then
            patch -p1 < /tmp/14837.patch
          fi
          python scripts/validate_1_48_37.py
          grep -q '<version>1.48.37</version>' pom.xml
          grep -q 'version: 1.48.37' src/main/resources/plugin.yml
          grep -q 'detectLegacyMineSites' src/main/java/com/arlight/bingo/listeners/OverworldIslandLoreDecorator.java
          grep -q 'planAccessibleServiceLoop' src/main/java/com/arlight/bingo/listeners/OverworldIslandLoreDecorator.java
          grep -q 'planContaminatedHalfBiome' src/main/java/com/arlight/bingo/listeners/OverworldIslandLoreDecorator.java

      - name: Guardar fuente 1.48.37 en la rama
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pom.xml src/main/resources/plugin.yml BUILD_VERSION.txt SOURCE_VERSION.txt \
            CAMBIOS_1.48.37.txt PROBAR_1.48.37.txt scripts/validate_1_48_37.py \
            src/main/java/com/arlight/bingo/listeners/OverworldCampaignRecoveryCommands.java \
            src/main/java/com/arlight/bingo/listeners/OverworldIslandLoreDecorator.java
          if ! git diff --cached --quiet; then
            git commit -m 'ArlightBingo 1.48.37: mina única accesible y biomas ampliados'
            git push origin HEAD:build/1.48.37-single-accessible-mine-biomes
          fi

      - name: Instalar ArlightCore 1.20.0
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/andrewBristowx/ArlightCore.git /tmp/ArlightCore
          mvn -B -U -DskipTests -f /tmp/ArlightCore/pom.xml clean install

      - name: Compilar con Maven
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -U -DskipTests clean package

      - name: Reunir entregables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/source
          find target -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name 'original-*.jar' \
            -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -name '*.jar' -print -quit)"
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/import/' \
            --exclude 'target/' \
            --exclude 'dist/' \
            ./ dist/source/
          (cd dist/source && zip -qr ../ArlightBingo-1.48.37-SOURCE.zip .)
          sha256sum dist/*.jar > dist/ArlightBingo-1.48.37-SHA256.txt
          ls -lh dist

      - name: Subir JAR compilado
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.37-JAR
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Subir fuente y verificación
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.37-SOURCE
          path: |
            dist/ArlightBingo-1.48.37-SOURCE.zip
            dist/ArlightBingo-1.48.37-SHA256.txt
          if-no-files-found: error
          retention-days: 30

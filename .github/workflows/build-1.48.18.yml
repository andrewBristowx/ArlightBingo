name: Compilar ArlightBingo 1.48.18

on:
  push:
    branches:
      - candidate/bingo-1.48.18-fortress-zone-polish
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Descargar fuente 1.48.18
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet gdown
          gdown 1C_Vjrce8vzlBjV7asV4Py7oBk5XDJiQM -O source.zip
          echo 'b5f9591d932c4479ae8fe0273862a429347aee46e26a2bbff2e780df48fbd516  source.zip' | sha256sum -c -
          unzip -q source.zip
          mv ArlightBingo-1.48.18-FORTRESS-ZONE-POLISH-SOURCE source

      - name: Verificar fuente
        shell: bash
        run: |
          set -euo pipefail
          cd source
          grep -q '<version>1.48.18</version>' pom.xml
          grep -q '^version: 1.48.18$' src/main/resources/plugin.yml
          grep -q 'puliendo puerta norte, patios y corredores críticos' src/main/java/com/arlight/bingo/listeners/OverworldCampaignBuilder148.java
          grep -q 'polishCriticalFortressZones' src/main/java/com/arlight/bingo/listeners/OverworldCampaignTerrain148.java
          grep -q 'boss.z() - 62' src/main/java/com/arlight/bingo/listeners/OverworldCampaignTerrain148.java

      - name: Descargar ArlightCore
        uses: actions/checkout@v4
        with:
          repository: andrewBristowx/ArlightCore
          ref: 597c130a5d5450ac92e02430def406ef22512bc9
          path: arlight-core

      - name: Instalar ArlightCore
        run: mvn -B -U -f arlight-core/pom.xml -DskipTests clean install

      - name: Compilar Bingo
        run: mvn -B -U -f source/pom.xml -DskipTests clean package

      - name: Verificar y empaquetar
        shell: bash
        run: |
          set -euo pipefail
          mkdir package
          cp source/target/ArlightBingo-1.48.18.jar package/
          unzip -p package/ArlightBingo-1.48.18.jar plugin.yml | grep -q '^version: 1.48.18$'
          unzip -l package/ArlightBingo-1.48.18.jar | grep -q 'OverworldCampaignTerrain148.class'
          cp source.zip package/ArlightBingo-1.48.18-FORTRESS-ZONE-POLISH-SOURCE.zip
          cd package
          sha256sum ArlightBingo-1.48.18.jar ArlightBingo-1.48.18-FORTRESS-ZONE-POLISH-SOURCE.zip > ArlightBingo-1.48.18-SHA256.txt
          sha256sum -c ArlightBingo-1.48.18-SHA256.txt

      - name: Subir entrega
        uses: actions/upload-artifact@v4
        with:
          name: ArlightBingo-1.48.18-DELIVERY
          path: package/*
          retention-days: 90

# ArlightBingo 1.38.0 - configuración modular
campaign:
  enabled: true
  somita-cinematics: true
  somita-guide:
    enabled: true
    auto-overworld: true
    auto-nether: true
    auto-end: true
    client-mod-minimum: 3.8.0
  mission-keys:
    recover-if-missing: true
  conquest:
    spawner-xp: 8
    protection-message-cooldown-seconds: 3
  rescue:
    cooldown-seconds: 6
    invulnerability-seconds: 5
  # Progresión jugable de la capital del Overworld (1.38.0).
  overworld-playable:
    enabled: true
    sequential-districts: true
    lock-citadel-until-cleared: true
    living-start-village: true
    district-order:
      - residential
      - commercial
      - military
    arlightbosses-required: "1.21.0+"
    provisional-mission-items: true
end-encounter:
  citadel-boss-entity: arlightbosses:void_guardian
  enabled: true
  amethyst-corrupted-dragon:
    enabled: true
    requires-arlightbosses: 1.19.0+
  dragon-spawn:
    x: 0
    y: 110
    z: 0
  central-gateway:
    x: 0
    y: 90
    z: 0
  reward-gateway:
    x: 96
    y: 90
    z: 0
end-campaign:
  base-y: 88
  exit-portal-delay-ticks: 80
  remove-vanilla-island: true
  clear-radius-x: 190
  clear-radius-z: 260
  clear-min-y: -32
  clear-max-y: 210
  organic-island: true
  city-detail-pass: true
  dragon-arena-radius: 72
  void-rescue-cooldown-seconds: 6
reference-city-pass:
  overworld:
    enabled: true
  nether:
    enabled: true
  end:
    enabled: true
terrain-adaptation:
  overworld:
    enabled: true
    radius: 178
    transition-width: 26
  nether:
    enabled: true
    radius-x: 174
    radius-z: 158
    cavern-height: 88
  end:
    enabled: true
professional-world-design:
  overworld:
    terrain-integrated-foundations: true
    village-functional-buildings: true
    public-space-details: true
  nether:
    functional-room-interiors: true
    exploration-loot-pass: true
    themed-enemy-rooms: true
  end:
    functional-districts: true
    satellite-island-identities: true
    exploration-loot-pass: true

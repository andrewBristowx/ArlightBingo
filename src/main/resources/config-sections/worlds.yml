# ArlightBingo 1.40.0 - plantillas con revisiones seguras
arena-world:
  enabled: true
  lobby-world: legos
  game-world: bingo_arena
  extra-worlds:
  - bingo_arena_nether
  - bingo_arena_the_end
  regen-on-start: false
  teleport-on-join: false
  teleport-players-on-start: true
  teleport-back-on-end: true
world-border:
  enabled: false
  min-size: 400
  padding: 150
  max-size: 8192
  search-radius: 10000
  announce-structure-coordinates: false
  locate-stronghold: false
  locate-nether-structures: false
  locate-end-city: false
  structure-keys:
    overworld:
    - betterstrongholds:stronghold
    nether:
    - betterfortresses:fortress
    end:
    - minecraft:end_city
  pregenerate: false
  pregenerate-radius: 128
world-pool:
  enabled: true
  size: 1
  base-name: bingo_arena
  prepare-on-startup: false
  prepare-next-during-match: false
  pregeneration:
    overworld-radius: 352
    nether-radius: 320
    end-radius: 384
  portals:
    use-multiverse-netherportals: true
    require-plugin: false
  inventories:
    auto-configure-groups: true
template-worlds:
  matches:
    enabled: true
    require-complete: true
  revisions:
    # La estable activa cuenta dentro de este límite.
    keep-latest: 3
    require-explicit-promotion: true
  safety:
    chunky-tile-radius: 384
    max-loaded-chunks-between-batches: 1024
    drain-check-interval-ticks: 100
    stable-drain-checks: 3
    build-chunk-ticket-release-delay-ticks: 100
    max-retained-build-chunks: 8
  overworld:
    enabled: true
    name: bingo_template_overworld
    seed: 741905270311
    radius: 1536
    blocks-per-tick: 500
    corruption-spacing: 48
    max-build-millis-per-tick: 8
    safe-corruption:
      decorate-on-chunk-load: true
      max-patches-per-chunk: 2
      ruin-chance-per-chunk: 0.035
    lootr-mode: LOOT_TABLES
    dungeon-extra-spawners: 18
    layout:
      village-x: -360
      village-z: 0
      city-x: 420
      city-z: 0
    zone-a:
      enabled: true
      width: 170
      depth: 155
      irregular-boundary: true
      functional-interiors: true
      visible-route-to-zone-b: true
  nether:
    enabled: true
    name: bingo_template_nether
    seed: 510932847112
    radius: 1024
    blocks-per-tick: 350
    max-build-millis-per-tick: 4
    protected-zone:
      clear-min-y: 36
      clear-max-y: 125
    finalization-load-interval-ticks: 10
  end:
    enabled: true
    name: bingo_template_end
    seed: 880174920611
    radius: 1024
    blocks-per-tick: 350
    max-build-millis-per-tick: 4
    finalization-load-interval-ticks: 10
    adaptive-supports:
      maximum-depth: 30
safe-world-handoff:
  enabled: true
  lobby-fallback-world: legos
  multiverse-settle-ticks: 10
  inventory-clear-delay-ticks: 8

# Somita se renderiza en cada cliente con ArlightChatClient 4.8.0 o superior.
somita:
  enabled: true

  effects:
    enabled: true
    # low, normal o high. Cada jugador puede reducirlos localmente en
    # config/arlightchatclient-somita.properties.
    intensity: normal
    maximum-particles: 36
    reduced-effects-fallback: true

  animations:
    appearance-ticks: 14
    vanish-ticks: 18
    celebration: celebrate_cute

  scenes:
    overworld:
      appearance-effect: overworld_appear
      point-effect: overworld_point
    nether:
      appearance-effect: nether_appear
      point-effect: nether_lock
    end:
      appearance-effect: end_appear
      point-effect: end_altar
    celebration:
      appearance-effect: celebration_burst
